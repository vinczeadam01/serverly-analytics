<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <button class="btn btn-link p-0 mb-2 text-decoration-none" (click)="goBack()">
        <i class="bi bi-arrow-left me-2"></i>
        Back to Hosts
      </button>
      <h1 class="h2 fw-bold mb-1">
        <i class="bi bi-server me-2 text-primary"></i>
        {{ hostname }}
      </h1>
    </div>
    <div class="d-flex gap-2">
      <app-period-selector></app-period-selector>
      <button class="btn btn-primary btn-sm d-flex align-items-center gap-2" (click)="onRefresh()" [disabled]="viewService.loading()">
        <i class="bi bi-arrow-clockwise" [class.spin]="viewService.loading()"></i>
        <span class="d-none d-sm-inline">Refresh</span>
      </button>
    </div>
  </div>

  @if (viewService.error(); as error) {
    <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
  }

  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <div class="chart-card">
        <div class="card-header"><h3 class="card-title">CPU Usage</h3></div>
        <div class="card-body">
          <div class="chart-container">
            @if (viewService.loading()) {
              <div class="skeleton-chart skeleton-animate"></div>
            } @else {
              <canvas baseChart [type]="lineChartType" [data]="cpuChartData()" [options]="lineChartOptions"></canvas>
            }
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="chart-card">
        <div class="card-header"><h3 class="card-title">Memory Usage</h3></div>
        <div class="card-body">
          <div class="chart-container">
            @if (viewService.loading()) {
              <div class="skeleton-chart skeleton-animate"></div>
            } @else {
              <canvas baseChart [type]="lineChartType" [data]="memoryChartData()" [options]="lineChartOptions"></canvas>
            }
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="chart-card">
        <div class="card-header"><h3 class="card-title">Network Throughput</h3></div>
        <div class="card-body">
          <div class="chart-container">
            @if (viewService.loading()) {
              <div class="skeleton-chart skeleton-animate"></div>
            } @else {
              <canvas baseChart [type]="lineChartType" [data]="networkChartData()" [options]="lineChartOptions"></canvas>
            }
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="chart-card">
        <div class="card-header"><h3 class="card-title">Disk I/O</h3></div>
        <div class="card-body">
          <div class="chart-container">
            @if (viewService.loading()) {
              <div class="skeleton-chart skeleton-animate"></div>
            } @else {
              <canvas baseChart [type]="lineChartType" [data]="diskChartData()" [options]="lineChartOptions"></canvas>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
