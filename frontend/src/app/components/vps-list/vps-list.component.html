<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h1 class="h2 fw-bold mb-1">
        <i class="bi bi-server me-2 text-primary"></i>
        VPS Monitoring
      </h1>
      <p class="text-muted mb-0">Hosts overview</p>
    </div>
    <div class="d-flex gap-2">
      <app-period-selector></app-period-selector>
      <button class="btn btn-primary btn-sm d-flex align-items-center gap-2" (click)="onRefresh()" [disabled]="service.loading()">
        <i class="bi bi-arrow-clockwise" [class.spin]="service.loading()"></i>
        <span class="d-none d-sm-inline">Refresh</span>
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-data-table
        [data]="service.paginated()"
        [columns]="columns"
        [loading]="service.loading()"
        [error]="service.error()"
        [searchPlaceholder]="'Search hostname'"
        [currentPage]="service.page()"
        [totalPages]="service.totalPages()"
        [emptyMessage]="'No hosts found'"
        (searchChange)="onSearchChange($event)"
        (pageChange)="onPageChange($event)"
        (rowClick)="onRowClick($event)">
      </app-data-table>
    </div>
  </div>
</div>
