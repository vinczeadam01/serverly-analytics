<div class="container-fluid">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h1 class="h2 fw-bold mb-1">
        <i class="bi bi-hdd-stack-fill me-2 text-primary"></i>
        Web Hosting Analytics
      </h1>
      <p class="text-muted mb-0">Apache/Nginx site monitoring and traffic analysis</p>
    </div>
    <div class="d-flex gap-2">
      <app-period-selector></app-period-selector>
      <button class="btn btn-primary btn-sm d-flex align-items-center gap-2"
              (click)="onRefresh()"
              [disabled]="analyticsService.loading()">
        <i class="bi bi-arrow-clockwise" [class.spin]="analyticsService.loading()"></i>
        <span class="d-none d-sm-inline">Refresh</span>
      </button>
    </div>
  </div>

  <!-- Sites Table -->
  <div class="row">
    <div class="col-12">
      <app-data-table
        [data]="analyticsService.paginatedSites()"
        [columns]="columns"
        [loading]="analyticsService.loading()"
        [error]="analyticsService.error()"
        [searchPlaceholder]="'Search site or domain'"
        [currentPage]="analyticsService.currentPage()"
        [totalPages]="analyticsService.totalPages()"
        [emptyMessage]="'No sites found'"
        (searchChange)="onSearchChange($event)"
        (pageChange)="onPageChange($event)"
        (rowClick)="onRowClick($event)">
      </app-data-table>
    </div>
  </div>
</div>
